name: Build Debug APK

# Runs automatically whenever you push to the main branch, and can also
# be triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest runners already ship with a full Android SDK
      # preinstalled at ANDROID_HOME, including recent platforms and
      # build-tools — so rather than reinstalling pieces of it (which
      # pulls in the legacy 'tools' package that Google has since removed
      # and that breaks third-party setup actions), we just accept the
      # licenses for what's already there and use it as-is.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
